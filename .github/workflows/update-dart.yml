name: Update DART financial data
on:
  workflow_dispatch:
  schedule:
    - cron: '15 15 1 * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect OpenDART
        env:
          DART_API_KEY: \${{ secrets.DART_API_KEY }}
          START_YEAR: '2010'
        run: python src/collect.py
      - name: Analyze
        run: python src/analyze.py
      - name: Validate
        run: python -m py_compile src/*.py && test -f dashboard/index.html && test -f dashboard/data/metrics.json
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data dashboard/data
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'chore: update OpenDART financial data'; git push; fi
